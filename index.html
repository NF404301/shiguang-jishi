<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时光记事 · 里程碑与小确幸</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2724;--mu:#8a8178;--ac:#d9622b;--ac2:#fbe9df;--bd:#ece5da;--sh:0 1px 3px rgba(60,40,20,.08);
--c1:#d9622b;--c2:#2b8a6e;--c3:#4a6fd1;--c4:#b8851f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#262321;--tx:#f0ebe4;--mu:#9d948a;--ac:#f08a57;--ac2:#3a2a20;--bd:#3a3631;--sh:none;--c1:#f08a57;--c2:#5fc4a2;--c3:#8aa6f0;--c4:#e0b04f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#262321;--tx:#f0ebe4;--mu:#9d948a;--ac:#f08a57;--ac2:#3a2a20;--bd:#3a3631;--sh:none;--c1:#f08a57;--c2:#5fc4a2;--c3:#8aa6f0;--c4:#e0b04f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:22px;margin:0}h1 small{display:block;font-size:12px;color:var(--mu);font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 13px;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:3px 9px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:20px;color:var(--ac)}.st span{font-size:12px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
.row>*{flex:1;min-width:120px}
textarea{min-height:76px;resize:vertical}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:3px 12px;cursor:pointer;font-size:13px;flex:none;width:auto;min-width:0}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.moods{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.moods span{font-size:22px;cursor:pointer;padding:0 4px;border-radius:8px;opacity:.45}
.moods span.on{opacity:1;background:var(--ac2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters input{flex:1;min-width:140px}.filters select{width:auto}
.otd{background:var(--ac2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.mon{font-size:13px;color:var(--mu);margin:18px 0 8px;font-weight:600}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}
.it{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.it::before{content:"";position:absolute;left:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--k);border:2px solid var(--bg)}
.it h3{margin:0;font-size:16px}.it .m{font-size:12px;color:var(--mu)}
.it p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:12px;color:var(--ac);margin-right:6px}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--k);color:#fff;margin-right:6px}
.acts{float:right;display:flex;gap:4px}
.acts button{border:0;background:none;cursor:pointer;color:var(--mu);font-size:16px;padding:0 3px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
#msg.show{opacity:1}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>时光记事<small>大事小事，值得记住的都写下来</small></h1><button class="btn p" id="newBtn">＋ 记一笔</button></header>
<div class="stats" id="stats"></div>
<div id="otd"></div>

<div class="card" id="form" hidden>
 <div class="types" id="fTypes"></div>
 <div class="row"><input id="fTitle" placeholder="发生了什么？（标题）" maxlength="60"><input id="fDate" type="date"></div>
 <textarea id="fNote" placeholder="写点细节、心情、当时的想法……（可选）"></textarea>
 <div style="height:8px"></div>
 <div class="moods" id="fMoods"></div>
 <div class="row"><input id="fTags" placeholder="标签，用空格或逗号分隔，如：家人 旅行"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="cancel">取消</button><button class="btn p" id="save">保存</button></div>
</div>

<div class="filters">
 <input id="q" placeholder="🔍 搜索标题、内容、标签">
 <select id="fType"></select>
 <select id="fYear"></select>
 <select id="fSort"><option value="d">最新在前</option><option value="a">最早在前</option></select>
</div>
<div class="types" id="tagBar"></div>
<div id="list"></div>

<div class="foot">
 <button class="btn sm" id="star">⭐ 只看星标</button>
 <button class="btn sm" id="exp">导出备份</button>
 <button class="btn sm" id="imp">导入备份</button>
 <button class="btn sm" id="theme">🌓 切换主题</button>
 <input type="file" id="file" accept=".json,application/json" hidden>
</div>
<div id="msg"></div>
</div>

<script>
const TYPES={milestone:{n:"里程碑",e:"🏆",k:"var(--c1)"},big:{n:"大事",e:"📌",k:"var(--c3)"},moment:{n:"美好时刻",e:"✨",k:"var(--c4)"},small:{n:"小事",e:"🌱",k:"var(--c2)"}};
const MOODS=["😄","🥰","🥹","😌","😮","😢","😤","🤔"];
const $=id=>document.getElementById(id);
let entries=[],editing=null,fType="small",fMood="",onlyStar=false,tagSel="",doc=null,userDoc=null;

const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const m=$("msg");m.textContent=t;m.classList.add("show");setTimeout(()=>m.classList.remove("show"),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- 存储：优先云端私有数据，失败则回退到浏览器本地 ---------- */
async function initStore(){
  try{
    const user=await claude.use("user"),db=await claude.use("db");
    if(user&&db){const id=await user.id();doc=db.collection("data/users/"+id).doc("journal");
      const s=await doc.get();const v=s&&(s.data?s.data():s);if(v&&Array.isArray(v.entries))entries=v.entries;return}
  }catch(e){doc=null}
  try{entries=JSON.parse(localStorage.getItem("journal")||"[]")}catch(e){entries=[]}
}
let saveT;
function persist(){clearTimeout(saveT);saveT=setTimeout(async()=>{
  if(doc){try{await doc.set({entries});return}catch(e){toast("云端保存失败，已存本地")}}
  try{localStorage.setItem("journal",JSON.stringify(entries))}catch(e){}
},300)}

/* ---------- 表单 ---------- */
function renderFormChips(){
  $("fTypes").innerHTML=Object.entries(TYPES).map(([k,t])=>`<button class="chip ${k===fType?"on":""}" data-t="${k}">${t.e} ${t.n}</button>`).join("");
  $("fMoods").innerHTML=MOODS.map(m=>`<span class="${m===fMood?"on":""}" data-m="${m}">${m}</span>`).join("");
}
$("fTypes").onclick=e=>{const t=e.target.dataset.t;if(t){fType=t;renderFormChips()}};
$("fMoods").onclick=e=>{const m=e.target.dataset.m;if(m){fMood=fMood===m?"":m;renderFormChips()}};
function openForm(en){
  editing=en?en.id:null;fType=en?en.type:"small";fMood=en?en.mood||"":"";
  $("fTitle").value=en?en.title:"";$("fDate").value=en?en.date:today();
  $("fNote").value=en?en.note||"":"";$("fTags").value=en?(en.tags||[]).join(" "):"";
  renderFormChips();$("form").hidden=false;$("fTitle").focus();$("form").scrollIntoView({behavior:"smooth",block:"center"});
}
$("newBtn").onclick=()=>openForm();
$("cancel").onclick=()=>{$("form").hidden=true};
$("save").onclick=()=>{
  const title=$("fTitle").value.trim();if(!title){toast("先写个标题吧");$("fTitle").focus();return}
  const tags=[...new Set($("fTags").value.split(/[\s,，、#]+/).filter(Boolean))];
  const data={type:fType,title,date:$("fDate").value||today(),note:$("fNote").value.trim(),mood:fMood,tags};
  if(editing){const i=entries.findIndex(x=>x.id===editing);entries[i]={...entries[i],...data}}
  else entries.push({id:uid(),star:false,created:Date.now(),...data});
  persist();$("form").hidden=true;render();toast("已记录 ✓");
};

/* ---------- 渲染 ---------- */
function render(){
  const now=new Date(),y=now.getFullYear();
  const total=entries.length,thisYear=entries.filter(e=>e.date.startsWith(y)).length;
  const ms=entries.filter(e=>e.type==="milestone").length;
  const days=new Set(entries.map(e=>e.date));let streak=0;const d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);
  while(days.has(d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()))){streak++;d.setDate(d.getDate()-1)}
  $("stats").innerHTML=[[total,"全部记录"],[thisYear,"今年记录"],[ms,"里程碑"],[streak,"连续记录天数"]].map(([a,b])=>`<div class="st"><b>${a}</b><span>${b}</span></div>`).join("");

  const md=today().slice(5);
  const past=entries.filter(e=>e.date.slice(5)===md&&!e.date.startsWith(y));
  $("otd").innerHTML=past.length?`<div class="otd">📅 <b>那年今日</b>　`+past.sort((a,b)=>a.date<b.date?1:-1).map(e=>`${e.date.slice(0,4)}年：${esc(e.title)}`).join("　·　")+`</div>`:"";

  const yrs=[...new Set(entries.map(e=>e.date.slice(0,4)))].sort().reverse();
  const cy=$("fYear").value,ct=$("fType").value;
  $("fYear").innerHTML=`<option value="">全部年份</option>`+yrs.map(v=>`<option ${v===cy?"selected":""}>${v}</option>`).join("");
  $("fType").innerHTML=`<option value="">全部类型</option>`+Object.entries(TYPES).map(([k,t])=>`<option value="${k}" ${k===ct?"selected":""}>${t.e} ${t.n}</option>`).join("");

  const tc={};entries.forEach(e=>(e.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  $("tagBar").innerHTML=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,14).map(([t,n])=>`<button class="chip ${t===tagSel?"on":""}" data-tag="${esc(t)}">#${esc(t)} ${n}</button>`).join("");

  const q=$("q").value.trim().toLowerCase(),yy=$("fYear").value,tt=$("fType").value;
  let list=entries.filter(e=>(!yy||e.date.startsWith(yy))&&(!tt||e.type===tt)&&(!onlyStar||e.star)&&(!tagSel||(e.tags||[]).includes(tagSel))
    &&(!q||(e.title+" "+(e.note||"")+" "+(e.tags||[]).join(" ")).toLowerCase().includes(q)));
  const asc=$("fSort").value==="a";
  list.sort((a,b)=>(a.date===b.date?a.created-b.created:a.date<b.date?-1:1)*(asc?1:-1));
  if(!list.length){$("list").innerHTML=`<div class="empty">${entries.length?"没有符合条件的记录":"还没有记录，点右上角「记一笔」开始吧 🌿"}</div>`;return}
  let html="",last="";
  for(const e of list){
    const m=e.date.slice(0,7);
    if(m!==last){if(last)html+="</div>";html+=`<div class="mon">${m.slice(0,4)} 年 ${+m.slice(5)} 月</div><div class="tl">`;last=m}
    const t=TYPES[e.type]||TYPES.small,dd=new Date(e.date+"T00:00:00"),wk="日一二三四五六"[dd.getDay()];
    html+=`<div class="it" style="--k:${t.k}"><div class="acts"><button data-a="star" data-id="${e.id}" title="星标">${e.star?"⭐":"☆"}</button><button data-a="edit" data-id="${e.id}" title="编辑">✎</button><button data-a="del" data-id="${e.id}" title="删除">🗑</button></div>
    <div class="m"><span class="badge">${t.n}</span>${+e.date.slice(5,7)}月${+e.date.slice(8)}日 周${wk}</div>
    <h3>${e.mood?e.mood+" ":""}${esc(e.title)}</h3>${e.note?`<p>${esc(e.note)}</p>`:""}
    ${(e.tags||[]).length?`<div style="margin-top:6px">${e.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join("")}</div>`:""}</div>`;
  }
  $("list").innerHTML=html+"</div>";
}
$("list").onclick=e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const en=entries.find(x=>x.id===b.dataset.id);if(!en)return;
  if(b.dataset.a==="star"){en.star=!en.star;persist();render()}
  else if(b.dataset.a==="edit")openForm(en);
  else if(confirm("确定删除这条记录吗？")){entries=entries.filter(x=>x.id!==en.id);persist();render();toast("已删除")}
};
$("tagBar").onclick=e=>{const t=e.target.dataset.tag;if(t){tagSel=tagSel===t?"":t;render()}};
["q","fType","fYear","fSort"].forEach(i=>$(i).oninput=render);
$("star").onclick=()=>{onlyStar=!onlyStar;$("star").style.background=onlyStar?"var(--ac2)":"";render()};

/* ---------- 备份 / 主题 ---------- */
$("exp").onclick=async()=>{
  const data=JSON.stringify({version:1,entries},null,1),name="时光记事备份-"+today()+".json";
  try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data});toast("已导出");return}}catch(e){}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click()}catch(e){}
  navigator.clipboard&&navigator.clipboard.writeText(data).then(()=>toast("已复制备份内容到剪贴板")).catch(()=>{});
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.entries;
    const ids=new Set(entries.map(x=>x.id));let n=0;
    arr.forEach(x=>{if(x&&x.title&&x.date&&!ids.has(x.id||"")){entries.push({id:x.id||uid(),type:x.type||"small",title:x.title,date:x.date,note:x.note||"",mood:x.mood||"",tags:x.tags||[],star:!!x.star,created:x.created||Date.now()});n++}});
    persist();render();toast("导入 "+n+" 条")}catch(err){toast("文件格式不对")}};
  r.readAsText(f);e.target.value="";
};
$("theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};

initStore().then(render);render();
</script>
</body>
</html>
